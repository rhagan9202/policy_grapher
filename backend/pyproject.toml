[project]
name = "policy-grapher"
version = "0.1.0"
description = "Knowledge graph over policy documents and their references"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141",
    "pydantic>=2.13",
    "pydantic-settings>=2.7",
    "neo4j>=6.2",
    "uvicorn[standard]>=0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "testcontainers[neo4j]>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_grapher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: requires a live Neo4j container (Docker must be running)",
]
