[project]
name = "policy-grapher"
version = "0.1.0"
description = "Knowledge graph over policy documents and their references"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141",
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.7",
    "neo4j>=6.2",
    "pypdf>=6.0",
    "uvicorn[standard]>=0.52",
    "rq>=2.11",
    "redis>=8.1",
    # STORY-036. A runtime dependency rather than a dev extra: reading an XLSX
    # manifest is a product action, and the Ingest screen offers those files.
    # Small and pure-Python, unlike the embeddings extra ADR-021 argued about.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# An extra rather than a plain dependency since STORY-052. sentence-transformers
# pulls torch, transformers and scikit-learn — about 4.5GB of virtualenv, and
# 16.2GB of backend image once the build layers are counted — which is worth
# keeping optional even now that it is usually installed.
#
# It is no longer "off by default" in the sense ADR-021 meant: ADR-029 supersedes
# it, the default stack carries its models, and docker-compose.yml passes
# `--extra local-embeddings` so a plain `docker compose up` builds this in.
# Optional still buys something — the lean stack, a direct `docker build`, and any
# consumer that wants the library rather than the model runtime — and configuring
# EMBEDDER_ADAPTER=local without it still raises MissingEmbeddingDependency at
# startup, naming this extra.
#
# The name is load-bearing: docker-compose.yml passes it verbatim to `uv sync`,
# and tests/test_compose_stack.py fails if the two stop agreeing.
local-embeddings = [
    "sentence-transformers>=5.0",
]

[dependency-groups]
dev = [
    # The extra, not a second copy of its contents: a developer's suite exercises
    # the real model in `local_or_skip`, and duplicating the floor here is exactly
    # the two-homes-for-one-fact problem that lets versions drift apart.
    "policy-grapher[local-embeddings]",
    "pytest>=9.1",
    "pytest-asyncio>=1.0",
    "testcontainers[neo4j,redis]>=4.0",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_grapher"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` and `Query(...)` in a parameter default is FastAPI's own idiom, not the
# mutable-default bug B008 exists to catch. Without this, every route signature in
# routers/ is a violation — 22 of them, none real. Ruff's default rule set is otherwise
# taken as-is.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: requires live Neo4j and Redis containers (Docker must be running)",
    "slow: reads real fixtures from disk (data/samples PDFs); no external services required",
]
filterwarnings = [
    # starlette's TestClient warns until httpx2 lands; the dependency floors in this
    # project pin us to httpx 1.x for now. Scoped to this message on purpose.
    # Note: StarletteDeprecationWarning subclasses UserWarning, not DeprecationWarning.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
