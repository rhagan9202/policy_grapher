services:
  neo4j:
    # Pinned deliberately: `latest` makes the database version depend on when the
    # image was last pulled. See docs/sprints/sprint-01/plan.md (risks), STORY-018.
    image: neo4j:2025.10
    ports:
      # Bound to loopback, not 0.0.0.0, for the reason ADR-018 records for port 5173:
      # anything that can reach these reads the corpus as the dev principal, and the
      # Neo4j browser on 7474 reaches the graph with the password init-env.sh generated.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    healthcheck:
      # HTTP check rather than cypher-shell: cypher-shell would need NEO4J_USER /
      # NEO4J_PASSWORD set inside this container, which nothing here provides, so it
      # would fail closed and block `backend` forever on service_healthy.
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
    volumes:
      - neo4j-data:/data

  backend:
    build:
      context: ./backend
      args:
        # `--extra local-embeddings` by default: the default stack carries its
        # models (ADR-028), and EMBEDDER_ADAPTER below is `local`, which needs
        # sentence-transformers in the image to work at all. That puts this
        # image at ~16.6GB rather than 399MB (ADR-029, reversing ADR-021's
        # STORY-052 reduction for this path). The worker below reads the same
        # variable, because both run the same image and the rebuild that needs
        # the embedder runs in the worker. A lean, model-free stack is
        # `docker-compose.lean.yml`, applied as a second `-f`.
        #
        # `-` and not `:-`, unlike every default in this file: `:-` substitutes
        # on empty as well as unset, so `BACKEND_EXTRAS=` in an .env was
        # silently overridden and the image built at 16.6GB anyway. Empty is a
        # meaningful value for this key — it is the lean build — so only an
        # absent line falls through to the default. The adapters below keep
        # `:-` deliberately: an empty string is not a valid adapter name.
        #
        # Three dashes, and it is not a typo: compose reads the first as the `-`
        # operator and the remaining `--extra local-embeddings` as the default.
        # Two would resolve to `-extra local-embeddings`, which `uv sync` rejects.
        # Guarded by tests/test_compose_stack.py.
        EXTRAS: ${BACKEND_EXTRAS---extra local-embeddings}
    # The healthcheck above probes HTTP; backend connects over bolt (7687) in
    # lifespan. If bolt isn't ready yet when neo4j reports HTTP-healthy,
    # verify_connectivity() raises and the container exits — restart instead of
    # staying dead, so "one command" isn't a coin flip on slower machines.
    restart: on-failure
    ports:
      # Bound to loopback, not 0.0.0.0, for the reason ADR-018 records for port 5173:
      # anything that can reach this port reads the corpus as the dev principal.
      - "127.0.0.1:8000:8000"
    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE}
      GRAPH_RENDER_CAP: ${GRAPH_RENDER_CAP}
      # Hardcoded, not ${DATA_DIR}: it must agree with the bind mount below, and a
      # .env override that disagreed would fail at ingest rather than at startup.
      DATA_DIR: /data/samples
      SAMPLE_CSV: ${SAMPLE_CSV}
      # Defaulted like the flags below it: a .env written before ADR-019 says
      # true, and a fresh clone should get an empty first run.
      AUTO_INGEST: ${AUTO_INGEST:-false}
      API_TOKENS: ${API_TOKENS}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      # Defaulted rather than bare ${...}: a .env generated before this variable
      # existed would otherwise pass an empty string, which is not a bool.
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      QUERY_ROW_CAP: ${QUERY_ROW_CAP}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS}
      # `local`, not `null`: the default stack carries its models (ADR-028), so
      # `ollama` below is an ordinary service rather than a profiled one, and
      # there is a model server on `docker compose up` for this to talk to. An
      # empty string would still be invalid here, same as before — lifespan
      # builds the configured extractor at boot and would raise on one. A
      # model-free stack is `docker-compose.lean.yml`, applied as a second
      # `-f`, which returns this to `null`.
      EXTRACTOR_ADAPTER: ${EXTRACTOR_ADAPTER:-local}
      # llama3.1:8b, not qwen3:8b: ADR-020 constrains weights to US-published
      # models, and this default disagreed with config.py's until sprint 4's
      # walkthrough caught it. It must also match `ollama-pull` below, or the
      # worker asks for a model that was never pulled.
      EXTRACTOR_MODEL: ${EXTRACTOR_MODEL:-llama3.1:8b}
      EXTRACTOR_BASE_URL: ${EXTRACTOR_BASE_URL:-http://ollama:11434}
      # Per model call. 600s because CPU inference is slow — a chunk measured at
      # ~7 tokens/second exceeded the old hardcoded 120s and killed the run (STORY-058).
      EXTRACTOR_TIMEOUT_SECONDS: ${EXTRACTOR_TIMEOUT_SECONDS:-600}
      # `local`, not `null`, for the same reason as EXTRACTOR_ADAPTER above:
      # this is what reaches Ask's semantic leg (ADR-016) from a plain `up`. A
      # `local` embedder needs sentence-transformers, which is why EXTRAS above
      # now builds it in by default (ADR-029) instead of leaving it out.
      EMBEDDER_ADAPTER: ${EMBEDDER_ADAPTER:-local}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-Snowflake/snowflake-arctic-embed-s}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      # Lowercase :z (shared label), not :Z (private label): this path now has two
      # consumers, backend and worker, each a long-running compose service. A
      # private label lets whichever container mounts it second steal exclusive
      # access and break the other's reads until restarted — observed twice during
      # development on ./frontend/src below, which is why it carries the same
      # reasoning. Do not "fix" this back to :Z for either service.
      - ./data:/data:ro,z
    # No `depends_on: redis`, deliberately, and the asymmetry with `worker` below
    # is the point. The backend needs nothing from Redis at boot: the connection
    # is lazy and `lifespan` never touches it, so with Redis down the app still
    # serves every route and only the two rebuild ones answer 503. Waiting on
    # `redis: service_healthy` here would turn one unhealthy container into a
    # total outage — the exact failure the lazy connection was built to avoid.
    # The worker genuinely cannot work without Redis, so it does wait.
    depends_on:
      neo4j:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    # No published port: only the backend and the worker speak to it, and both
    # are on this network. Publishing it would put an unauthenticated data store
    # on the host for nothing.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
      args:
        # Must match the backend's, above: both services run the same image, and a
        # worker built without the extra would fail every rebuild that embeds while
        # the backend started clean. `--extra local-embeddings` by default, same as
        # the backend, per ADR-028/ADR-029; `docker-compose.lean.yml` returns both
        # to empty. `-` rather than `:-` for the reason written out above.
        EXTRAS: ${BACKEND_EXTRAS---extra local-embeddings}
    restart: on-failure
    # "rebuilds" must equal QUEUE_NAME in backend/src/policy_grapher/jobs/queue.py,
    # where the same warning is written. The `rq` CLI takes queue names as
    # arguments and cannot import the constant, so this is a second copy: change
    # one without the other and the worker listens on an empty queue forever
    # while the routes keep answering 202.
    command: ["uv", "run", "rq", "worker", "rebuilds"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # The same configuration as the backend, deliberately: the worker opens its
      # own Neo4j driver and builds its own extractor and embedder.
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE}
      DATA_DIR: /data/samples
      # Two names for one value, fed from the same default so they cannot drift:
      # REDIS_URL is what this project's own Settings reads (matching the backend),
      # RQ_REDIS_URL is what the `rq` CLI's --url flag falls back to when --url isn't
      # passed on the command line. The command above deliberately omits --url so
      # this variable is what actually controls where the worker listens.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RQ_REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # `local`, not `null`: the default stack carries its models (ADR-028), and
      # this is the queue that runs rebuilds, so it is the leg that actually
      # extracts. `docker-compose.lean.yml` returns this to `null`.
      EXTRACTOR_ADAPTER: ${EXTRACTOR_ADAPTER:-local}
      # llama3.1:8b, not qwen3:8b: ADR-020 constrains weights to US-published
      # models, and this default disagreed with config.py's until sprint 4's
      # walkthrough caught it. It must also match `ollama-pull` below, or the
      # worker asks for a model that was never pulled.
      EXTRACTOR_MODEL: ${EXTRACTOR_MODEL:-llama3.1:8b}
      EXTRACTOR_BASE_URL: ${EXTRACTOR_BASE_URL:-http://ollama:11434}
      # Per model call. 600s because CPU inference is slow — a chunk measured at
      # ~7 tokens/second exceeded the old hardcoded 120s and killed the run (STORY-058).
      EXTRACTOR_TIMEOUT_SECONDS: ${EXTRACTOR_TIMEOUT_SECONDS:-600}
      # `local`, not `null`, for the same reason as EXTRACTOR_ADAPTER above: this
      # is the leg that embeds for Ask's semantic search (ADR-016), and it needs
      # the extra above (ADR-029) to have anything to run.
      EMBEDDER_ADAPTER: ${EMBEDDER_ADAPTER:-local}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-Snowflake/snowflake-arctic-embed-s}
    volumes:
      # Load-bearing, not incidental: rebuild_derived re-reads the source PDF
      # from `file:///data/samples/...`, a path inside a container. The route's
      # readability check runs in the backend, where the file exists — a worker
      # without this mount fails every job on a check that already passed.
      - ./data:/data:ro,z

  frontend:
    build: ./frontend
    ports:
      # Bound to loopback, not 0.0.0.0: the dev proxy adds the API token to the GET
      # requests it forwards, so anything that can reach this port reads the corpus as
      # the dev principal. On the developer's own machine that is the point; from the
      # rest of the network it is an open door.
      - "127.0.0.1:5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
      API_TOKEN: ${API_TOKEN}
      # No `:-` fallback: the default is empty. A hostname baked in here is
      # what actually takes effect whenever `.env` omits the line, which is
      # every checkout but the one it was written on. `.env.example` documents
      # the variable with an example value; that is documentation, this was not.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    volumes:
      # Lowercase :z (shared label), not :Z (private label), on purpose: this path has
      # two consumers, the long-running compose service and any ad-hoc tooling
      # container (`docker compose run`/`build`, a one-off `docker run`) used to
      # install deps or run tests. A private label lets whichever container mounts it
      # second steal exclusive access and break the other's reads until restarted —
      # observed twice during development. `./data` now has two consumers as well
      # (backend and worker), so it takes the same shared label for the same reason.
      - ./frontend/src:/app/src:ro,z
    depends_on:
      - backend

  # Both services below are part of the default stack (ADR-028:
  # docs/specs/adr/ADR-028-the-default-stack-carries-its-models.md): without a
  # model server, EXTRACTOR_ADAPTER and EMBEDDER_ADAPTER have nothing to talk
  # to, and Review, Triage, and Ask's semantic leg cannot fill on a plain
  # `docker compose up`. The cost is real and front-loaded — the image is
  # 8.43GB, and the weights it pulls on first run (llama3.1:8b, by default)
  # are about another 4.9GB — but it is paid once, in the named volume below.
  # A stack without the model server is `docker compose -f docker-compose.yml
  # -f docker-compose.lean.yml up`, not a profile to remember to unset.
  ollama:
    image: ollama/ollama:latest
    # Published on loopback, unlike redis, because the extraction ratchet
    # (tests/test_obligation_ratchet.py) runs on the host and reaches the model
    # at Settings.extractor_base_url — the default of which is localhost:11434.
    # In-network callers use http://ollama:11434 instead.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Pulls the model once and exits. Without it the stack looks healthy while
  # every extraction fails against a server that has no weights loaded. The
  # named volume above makes a second run a no-op, so this is slow exactly once.
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      EXTRACTOR_MODEL: ${EXTRACTOR_MODEL:-llama3.1:8b}
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$${EXTRACTOR_MODEL}"']

volumes:
  neo4j-data:
  # Model weights, so a re-created ollama container does not re-download 4.9GB.
  ollama-models:
