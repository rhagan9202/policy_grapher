services:
  neo4j:
    # Pinned deliberately: `latest` makes the database version depend on when the
    # image was last pulled. See docs/sprints/sprint-01/plan.md (risks), STORY-018.
    image: neo4j:2025.10
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    healthcheck:
      # HTTP check rather than cypher-shell: cypher-shell would need NEO4J_USER /
      # NEO4J_PASSWORD set inside this container, which nothing here provides, so it
      # would fail closed and block `backend` forever on service_healthy.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
    volumes:
      - neo4j-data:/data

  backend:
    build: ./backend
    # The healthcheck above probes HTTP; backend connects over bolt (7687) in
    # lifespan. If bolt isn't ready yet when neo4j reports HTTP-healthy,
    # verify_connectivity() raises and the container exits — restart instead of
    # staying dead, so "one command" isn't a coin flip on slower machines.
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE}
      GRAPH_RENDER_CAP: ${GRAPH_RENDER_CAP}
      # Hardcoded, not ${DATA_DIR}: it must agree with the bind mount below, and a
      # .env override that disagreed would fail at ingest rather than at startup.
      DATA_DIR: /data/samples
      SAMPLE_CSV: ${SAMPLE_CSV}
      AUTO_INGEST: ${AUTO_INGEST}
      API_TOKENS: ${API_TOKENS}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      QUERY_ROW_CAP: ${QUERY_ROW_CAP}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS}
    volumes:
      # :Z relabels the host directory for exclusive container access under SELinux
      # (enforcing on Fedora/RHEL hosts); harmless no-op where SELinux is disabled.
      - ./data:/data:ro,Z
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      # Lowercase :z (shared label), not :Z (private label), on purpose: this path has
      # two consumers, the long-running compose service and any ad-hoc tooling
      # container (`docker compose run`/`build`, a one-off `docker run`) used to
      # install deps or run tests. A private label lets whichever container mounts it
      # second steal exclusive access and break the other's reads until restarted —
      # observed twice during development. `./data` has only one consumer (backend),
      # so it keeps :Z. Do not "fix" this back to :Z for consistency.
      - ./frontend/src:/app/src:ro,z
    depends_on:
      - backend

volumes:
  neo4j-data:
