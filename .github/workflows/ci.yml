# STORY-051. Until this file existed, every check in the project depended on a
# person choosing to run `uv run pytest` and `npm test`.
#
# The shape here is not accidental. See ADR-022.
name: CI

on:
  push:
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
# Cancelling it is not a speedup so much as a way of keeping the queue honest —
# the run people wait on should be the one describing the current commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (539 tests, ruff among them)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned for the same reason backend/Dockerfile pins it: `latest` makes
          # the build depend on when it last ran.
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # The full developer environment, not `--no-dev`. `dev` pulls the
      # `local-embeddings` extra and therefore torch, which is heavy and
      # deliberate: two tests can only be demonstrated by a real model, and
      # ADR-021 made that library optional for the *image*, not for the suite.
      # Without it those two skip, and a skip nobody reads is how a check dies.
      - name: Install dependencies
        run: uv sync --frozen

      # Split from the integration run below so a failure says which half broke
      # without anyone opening the log. Lint rides along here as test_lint.py —
      # this subset needs no container, so it is also the fastest possible "is
      # the tree even sane" answer.
      - name: Unit tests and lint
        run: uv run pytest -m "not integration" -rs

      # The load-bearing step. Selecting by marker means pytest exits 5 — "no
      # tests ran" — if the marker ever selects nothing, so this step fails
      # rather than passes when the integration suite goes missing. Testcontainers
      # starts real Neo4j and Redis against the Docker daemon on the runner.
      # `-rs` prints skip reasons, because a silent skip here is the exact
      # failure this job exists to prevent.
      - name: Integration tests (real Neo4j and Redis)
        run: uv run pytest -m integration -rs

      # The extraction canary. Until this existed it skipped on every push:
      # `extractor_adapter` defaults to "null", FLOORS has no entry for "null",
      # and the test takes its first skip branch — so the gate on the product's
      # core value was green because nothing ran it. llama3.2:3b rather than the
      # shipped 8b because 2GB is affordable per push and 4.9GB is not; its
      # floors are its own, measured separately.
      #
      # Read "canary", not "quality gate on the shipped model". At recall 0.250
      # (7 of 28 gold obligations found — see test_obligation_ratchet.py) the
      # floors sit with essentially no headroom above the observation: what this
      # step actually catches is catastrophe on the extraction path — a broken
      # prompt template, a mis-wired decoding mode, a bad ollama runtime bump,
      # the adapter failing to reach the model at all. It does NOT catch quality
      # regression in llama3.1:8b, the model that ships. A prompt change that
      # helps 3b and quietly wrecks 8b passes this step green; that comparison
      # is 8b's own floors' job, not this one's.
      - name: Start the pinned model runtime
        timeout-minutes: 10
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:0.32.15
          for _ in $(seq 1 60); do
            curl -sf http://localhost:11434/api/version && break
            sleep 2
          done
          docker exec ollama ollama pull llama3.2:3b

      - name: Extraction canary (llama3.2:3b)
        env:
          EXTRACTOR_ADAPTER: local
          EXTRACTOR_MODEL: llama3.2:3b
          EXTRACTOR_BASE_URL: http://localhost:11434
        # -rs prints skip reasons. A skip here means the canary did not run,
        # which is the failure this step exists to prevent — read the reason,
        # do not assume the tick means it passed.
        #
        # timeout-minutes: measured 205-216s locally for this pytest run; a
        # 2-vCPU runner doing CPU inference cold has no guarantee of matching
        # that, so 20 minutes gives roughly 5-6x headroom over the local figure
        # rather than burning the whole job's default timeout on a hang.
        timeout-minutes: 20
        run: uv run pytest tests/test_obligation_ratchet.py -v -rs

  frontend:
    name: Frontend (eslint, tsc, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches frontend/Dockerfile, so CI and the container agree on the
          # runtime rather than differing by whatever the runner ships.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci` rather than `install`: it installs the lockfile exactly and fails if
      # package.json and package-lock.json disagree, which `install` would
      # silently reconcile.
      - name: Install dependencies
        run: npm ci

      # One command, three gates, each gating the next: eslint --max-warnings=0,
      # then tsc -b, then vitest. STORY-032 made the type check part of `npm test`
      # precisely so it could not be skipped independently.
      - name: Lint, typecheck and test
        run: npm test

  compose:
    name: Compose build (backend, worker, frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Definition of Done's last gate is "runs under `docker compose up` from a
      # clean checkout", and until STORY-059 the only thing that ever proved it was a
      # person running one command — in a sprint that changed the backend image, both
      # `uv sync` stages, and the build arguments for two services.
      #
      # Through compose rather than `docker build`: the EXTRAS build argument and the
      # fact that backend and worker share one image are declared in compose and
      # nowhere else, so building the Dockerfile directly would prove neither.
      # `tests/test_ci.py` asserts this step names every service compose builds.
      #
      # ADR-029 made the default stack carry the model runtime, so its images are
      # ~16.6GB — building it here would blow the size gate below on every push.
      # `-f docker-compose.lean.yml` layers the flagged-off path back on top,
      # which is the stack the 1GB gate below is meant to measure.
      - name: Build every image compose builds
        run: docker compose -f docker-compose.yml -f docker-compose.lean.yml build backend worker frontend

      # A build that succeeds while the file is malformed is not a check. `config`
      # resolves interpolation, defaults and profiles — the layer that carried the
      # qwen3:8b default past every test in sprint 4.
      - name: The compose file itself resolves
        run: docker compose -f docker-compose.yml -f docker-compose.lean.yml config --quiet

      # CI no longer builds the default stack at all, so nothing above would catch
      # a syntax error in it. This is the one thing left guarding its validity.
      - name: The default stack resolves too
        run: docker compose config --quiet

      # No extras, so this measures the lean image docker-compose.lean.yml produces —
      # not the default path, which ADR-029 put back at ~16.6GB. A regression here
      # means ADR-029's lean path has regrown; that path is what STORY-052 took from
      # 16.6GB to 399MB, and what this gate has protected ever since.
      #
      # `docker image inspect .Size` is NOT the figure `docker images` prints and the
      # ADRs quote: measured 2026-08-23, the backend is 399MB by `docker images` and
      # 96MB by `.Size`, and ollama is 8.43GB against 3379MB. `.Size` is used because
      # it is a byte count a shell can compare; the 1GB threshold sits far above the
      # lean image and far below the regression in *either* measure, so the gap
      # between them cannot make this pass when it should fail.
      - name: The lean image has not regrown
        run: |
          for image in policy_grapher-backend policy_grapher-worker; do
            bytes=$(docker image inspect "$image" --format '{{.Size}}')
            echo "$image: $((bytes / 1000000)) MB"
            if [ "$bytes" -gt 1000000000 ]; then
              echo "::error::$image exceeds 1GB. ADR-029 keeps the model runtime out of the lean stack; this measures docker-compose.lean.yml, not the default image."
              exit 1
            fi
          done
