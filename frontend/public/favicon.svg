  <g stroke="#94a3b8" stroke-width="1.6">
    <line x1="16" y1="10" x2="9" y2="22"/>
    <line x1="16" y1="10" x2="23" y2="22"/>
    <line x1="9" y1="22" x2="23" y2="22"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="16" cy="10" r="4"/>
    <circle cx="9" cy="22" r="3.2"/>
    <circle cx="23" cy="22" r="3.2"/>
  </g>
</svg>
